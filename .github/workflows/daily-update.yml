# Keeps the committed database current without anyone running anything.
#
# Every day this fetches whatever the PDMO has published since the last run,
# parses it into data/sgcp.sqlite, fits that day's yield curve, recomputes the
# relative-value signals, refreshes the charts, the dashboard page and the
# plain-text readout, and commits the result back to this repository. A day
# with nothing new (weekend, public holiday) simply makes no commit. Today's
# signals are printed into the run log too, so the Actions page doubles as a
# daily readout.
#
# You can also start a run by hand: Actions tab -> "Daily PDMO update" ->
# "Run workflow".

name: Daily PDMO update

on:
  schedule:
    # 20:00 UTC = 01:30 in Colombo the next morning, comfortably after the
    # day's reports are posted. Cron here is always in UTC.
    - cron: "0 20 * * *"
  workflow_dispatch:

# The job commits back to the repo, so it needs write access to contents.
permissions:
  contents: write

# Never let two runs (say a manual one and the scheduled one) push at once.
concurrency:
  group: daily-pdmo-update

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch and parse anything new
        run: python -m pipeline.update

      - name: Fit the curve for any newly loaded day
        # Only days without a curve are fitted; lambda stays as calibrated,
        # so today's residuals are measured on the same scale as history's.
        run: python -m curves.fit

      - name: Refresh the watched bonds' charts
        run: |
          for isin in LKB00530H016 LKB00934F154 LKB00934J156 LKB01136H151; do
            python -m pipeline.report --isin "$isin" --tail 5
          done

      - name: Refresh the latest curve chart
        run: python -m curves.fit --plot-latest

      - name: Recompute the relative-value signals
        # Rebuilt wholesale from the residuals (cheap), so a change to the
        # window or pair rule can never leave half the history on old rules.
        run: python -m signals.run

      - name: Print today's signals into the run log
        # Also kept as a committed plain-text readout, so the day's core book
        # can be read from the repository without running anything.
        run: python -m signals.report | tee data/reports/signals.txt

      - name: Rebuild the dashboard page
        run: python -m dashboard.build

      - name: Commit the refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sgcp.sqlite data/reports docs/index.html
          # --quiet exits non-zero when there IS something staged, so this
          # commits on change and stays silent on a no-news day.
          git diff --cached --quiet && echo "nothing new today" && exit 0
          git commit -m "Daily data update ($(date -u +%Y-%m-%d))"
          git push
